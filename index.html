<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>audioNest - Ηχητικά Βιβλία Premium</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0c12;
      font-family: 'DM Sans', sans-serif;
      color: #f0f0f0;
      overflow-x: hidden;
    }

    /* Mobile-first container */
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      background: radial-gradient(circle at 20% 30%, #141824, #0b0d14);
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
    }

    /* Glassmorphism core */
    .glass-card {
      background: rgba(20, 24, 36, 0.55);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .glass-card-light {
      background: rgba(30, 34, 48, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Scroll horizontal snaps */
    .scroll-x {
      display: flex;
      overflow-x: auto;
      gap: 16px;
      scrollbar-width: thin;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-x::-webkit-scrollbar {
      height: 4px;
    }

    /* Typography */
    h1, h2, h3, .serif {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
    }

    /* Buttons */
    .btn-primary {
      background: rgba(108, 92, 231, 0.9);
      backdrop-filter: blur(4px);
      border-radius: 40px;
      padding: 10px 18px;
      font-weight: 600;
      border: none;
      color: white;
      transition: 0.2s;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 40px;
      padding: 10px 16px;
      font-weight: 500;
    }

    /* mini player */
    .mini-player {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 448px;
      background: rgba(18, 22, 32, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 60px;
      padding: 8px 16px;
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    /* bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(12, 15, 22, 0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-around;
      padding: 12px 20px 26px;
      z-index: 99;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #aaa;
      transition: 0.2s;
    }
    .nav-item.active, .nav-item:active {
      color: #c084fc;
    }

    /* main content padding for bottom nav/miniplayer */
    .main-content {
      padding: 20px 20px 110px 20px;
    }

    .toast {
      position: fixed;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1b2e;
      backdrop-filter: blur(12px);
      padding: 10px 20px;
      border-radius: 40px;
      z-index: 200;
      font-weight: 500;
      pointer-events: none;
      transition: 0.2s;
    }

    /* custom */
    .progress-bar {
      height: 5px;
      background: #2a2e3f;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #c084fc;
    }
    img.book-cover {
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    }
    input, select, textarea {
      background: #1e1f2c;
      border: 1px solid #353a4a;
      border-radius: 20px;
      padding: 12px 16px;
      color: white;
    }
  </style>
</head>
<body>
<div class="app-container" id="appContainer">
  <!-- Dynamic header with back/avatar -->
  <div id="dynamicHeader" style="padding: 20px 20px 8px 20px; display: flex; justify-content: space-between; align-items: center;">
    <div id="backBtnWrapper"></div>
    <div class="serif" style="font-size: 22px;">audioNest</div>
    <div id="avatarWrapper"></div>
  </div>

  <!-- Main screens injected here -->
  <div id="screenContainer" class="main-content"></div>

  <!-- Mini Player (global) -->
  <div id="miniPlayer" class="mini-player" style="display: none;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img id="miniCover" src="" width="44" height="44" style="border-radius: 12px; object-fit: cover;">
      <div style="flex:1">
        <div id="miniTitle" style="font-weight:600; font-size:14px;"></div>
        <div id="miniAuthor" style="font-size:12px; color:#bbb"></div>
      </div>
      <button id="miniPlayPause" style="background:none; border:none; color:white;"><i data-lucide="play"></i></button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item" data-nav="home"><i data-lucide="house"></i><span>Αρχική</span></div>
    <div class="nav-item" data-nav="library"><i data-lucide="library"></i><span>Βιβλιοθήκη</span></div>
    <div class="nav-item" data-nav="search"><i data-lucide="search"></i><span>Αναζήτηση</span></div>
  </div>
</div>

<script>
  // ---------- DATA MODELS ----------
  const booksDB = [
    { id: "b1", title: "Ματωμένο Φεγγάρι", author: "Ελένη Βάρναλη", narrator: "Μιχάλης Σαράντης", genre: "Μυστήριο & Θρίλερ", releaseDate: "2024", rating: 4.8, price: 12.99, cover: "https://picsum.photos/id/104/300/450", description: "Ένα θρίλερ που κόβει την ανάσα... μυστικά σε ένα νησί.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
    { id: "b2", title: "Αιώνια Ρομαντζά", author: "Ναταλία Καρτερού", narrator: "Δήμητρα Μήτση", genre: "Ρομαντικά", releaseDate: "2024", rating: 4.6, price: 9.99, cover: "https://picsum.photos/id/26/300/450", description: "Μια ιστορία αγάπης που ταξιδεύει στον χρόνο.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
    { id: "b3", title: "Το Λάθος Αστέρι", author: "Φοίβος Γιαννόπουλος", narrator: "Αλέξης Γεωργίου", genre: "Μυθιστορήματα & Λογοτεχνία", releaseDate: "2023", rating: 4.9, price: 14.99, cover: "https://picsum.photos/id/20/300/450", description: "Δύο άγνωστοι συναντιούνται στο Παρίσι.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
    { id: "b4", title: "Τέχνη της Επιτυχίας", author: "Λίνα Μαυρίδη", narrator: "Αντρέας Κωνσταντίνου", genre: "Μη Μυθοπλασία", releaseDate: "2025", rating: 4.5, price: 17.99, cover: "https://picsum.photos/id/0/300/450", description: "Εργαλεία ανάπτυξης για κάθε επαγγελματία.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
    { id: "b5", title: "Ο Κήπος με τα Μυστικά", author: "Σοφία Κερασίδου", narrator: "Ειρήνη Παπαδάκη", genre: "Παιδικά", releaseDate: "2024", rating: 4.7, price: 6.99, cover: "https://picsum.photos/id/128/300/450", description: "Ένα παραμύθι για μικρούς και μεγάλους.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
    { id: "b6", title: "Σκοτεινά Ρεύματα", author: "Νίκος Αλεξίου", narrator: "Πέτρος Λαγός", genre: "Μυστήριο & Θρίλερ", releaseDate: "2025", rating: 4.8, price: 13.99, cover: "https://picsum.photos/id/175/300/450", description: "Υπόθεση εξαφάνισης στην Αθήνα.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
    { id: "b7", title: "Το Αστέρι της Αυγής", author: "Μαρία Παπαδάκη", narrator: "Λυδία Φωτιάδου", genre: "Ρομαντικά", releaseDate: "2024", rating: 4.3, price: 10.99, cover: "https://picsum.photos/id/169/300/450", description: "Ταξίδι στη Σαντορίνη.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
    { id: "b8", title: "Καθρέφτες Ψυχής", author: "Δημήτρης Παπαδόπουλος", narrator: "Άννα Μονογιού", genre: "Μυθιστορήματα & Λογοτεχνία", releaseDate: "2023", rating: 4.9, price: 11.99, cover: "https://picsum.photos/id/42/300/450", description: "Μια οικογενειακή σάγκα.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
  ];
  // user & storage
  let purchasedBooks = []; // ids
  let listeningProgress = {}; // { bookId: progressSeconds }
  let currentUser = { name: "Αθηνά Μέρτζου", phone: "6901234567", email: "athena@audiobook.gr", address: "Λεωφόρος Συγγρού 15, Αθήνα" };
  let paymentMethods = [{ type: "credit_card", last4: "4242", brand: "Visa" }, { type: "paypal", email: "user@paypal.com" }];
  let activeBookPlaying = null; // current playing object
  let audio = null; // global audio
  let currentSpeed = 1;
  let isPlayingGlobal = false;
  let currentScreen = "home";
  let selectedBookForPayment = null;
  let genreFilter = null; // for home store section filter

  // helpers
  function saveStorage() {
    localStorage.setItem("purchasedBooks", JSON.stringify(purchasedBooks));
    localStorage.setItem("listeningProgress", JSON.stringify(listeningProgress));
    localStorage.setItem("currentUser", JSON.stringify(currentUser));
    localStorage.setItem("paymentMethods", JSON.stringify(paymentMethods));
  }
  function loadStorage() {
    const storedPurchased = localStorage.getItem("purchasedBooks");
    if(storedPurchased) purchasedBooks = JSON.parse(storedPurchased);
    const storedProgress = localStorage.getItem("listeningProgress");
    if(storedProgress) listeningProgress = JSON.parse(storedProgress);
    const storedUser = localStorage.getItem("currentUser");
    if(storedUser) currentUser = JSON.parse(storedUser);
    const storedPayments = localStorage.getItem("paymentMethods");
    if(storedPayments) paymentMethods = JSON.parse(storedPayments);
  }

  function isOwned(bookId) { return purchasedBooks.includes(bookId); }

  function showToast(msg) {
    let toast = document.createElement("div");
    toast.className = "toast glass-card";
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  // audio helpers
  function initAudio(src, bookId) {
    if(audio) { audio.pause(); audio = null; }
    audio = new Audio(src);
    audio.playbackRate = currentSpeed;
    audio.addEventListener("timeupdate", () => {
      if(activeBookPlaying === bookId && audio) {
        listeningProgress[bookId] = audio.currentTime;
        saveStorage();
        updateMiniProgress?.(audio.currentTime);
        if(document.getElementById("playerProgressFill")) updatePlayerProgressBar();
      }
    });
    audio.addEventListener("ended", () => { isPlayingGlobal=false; updateMiniPlayButton(true); if(currentScreen === "player") renderPlayerScreen(bookId); });
    return audio;
  }

  function playBook(bookId) {
    const book = booksDB.find(b=>b.id===bookId);
    if(!book || !isOwned(bookId)) return;
    const src = book.previewUrl;
    if(activeBookPlaying !== bookId) {
      if(audio) audio.pause();
      initAudio(src, bookId);
      activeBookPlaying = bookId;
      const saved = listeningProgress[bookId] || 0;
      audio.currentTime = saved;
    }
    audio.play().catch(e=>console.log);
    isPlayingGlobal = true;
    updateMiniPlayButton(false);
    if(currentScreen === "player") renderPlayerScreen(bookId);
    updateMiniPlayerUI(book);
  }

  function pauseCurrent() { if(audio) { audio.pause(); isPlayingGlobal=false; updateMiniPlayButton(true); if(currentScreen==="player") renderPlayerScreen(activeBookPlaying); } }

  function seekProgress(percent) { if(audio && activeBookPlaying) { audio.currentTime = audio.duration * percent; } }
  function setSpeed(speed) { currentSpeed = speed; if(audio) audio.playbackRate = speed; if(currentScreen==="player") renderPlayerScreen(activeBookPlaying); }

  function updateMiniPlayerUI(book) {
    const miniDiv = document.getElementById("miniPlayer");
    if(book && isOwned(book.id)) {
      miniDiv.style.display = "flex";
      document.getElementById("miniCover").src = book.cover;
      document.getElementById("miniTitle").innerText = book.title;
      document.getElementById("miniAuthor").innerText = book.author;
    } else if(!book) miniDiv.style.display = "none";
    else miniDiv.style.display = "none";
  }
  function updateMiniPlayButton(isPausedState) { const btn = document.getElementById("miniPlayPause"); if(btn) btn.innerHTML = isPausedState ? '<i data-lucide="play"></i>' : '<i data-lucide="pause"></i>'; lucide.createIcons(); }
  function updateMiniProgress(sec) { /* optional */ }
  function updatePlayerProgressBar() { if(audio && activeBookPlaying && currentScreen==="player") { let perc = (audio.currentTime/audio.duration)*100; let fill = document.getElementById("playerProgressFill"); if(fill) fill.style.width = perc+"%"; document.getElementById("currentTime").innerText = formatTime(audio.currentTime); document.getElementById("durationTime").innerText = formatTime(audio.duration||0); } }
  function formatTime(sec){ if(isNaN(sec)) return "0:00"; let m=Math.floor(sec/60); let s=Math.floor(sec%60); return `${m}:${s<10?'0'+s:s}`; }

  // Navigation & Rendering
  function navigateTo(screen, param=null) {
    currentScreen = screen;
    if(screen === "product") renderProductDetail(param);
    else if(screen === "payment") renderPaymentScreen(param);
    else if(screen === "player") renderPlayerScreen(param);
    else if(screen === "profile") renderProfileScreen();
    else if(screen === "userDetails") renderUserDetails();
    else if(screen === "paymentMethods") renderPaymentMethodsScreen();
    else if(screen === "home") renderHomeScreen();
    else if(screen === "library") renderLibraryScreen();
    else if(screen === "search") renderSearchScreen();
    else if(screen === "terms") renderTermsScreen();
    updateHeader(screen);
  }

  function updateHeader(screen) {
    const backDiv = document.getElementById("backBtnWrapper");
    const avatarDiv = document.getElementById("avatarWrapper");
    if(screen !== "home" && screen !== "library" && screen !== "search" && screen !== "profile") {
      backDiv.innerHTML = '<button id="backButton" style="background:none; border:none;"><i data-lucide="arrow-left"></i></button>';
      document.getElementById("backButton")?.addEventListener("click", ()=> { if(history.length) navigateTo("home"); else navigateTo("home"); });
    } else backDiv.innerHTML = '';
    if(screen === "home") avatarDiv.innerHTML = '<button id="profileAvatarBtn" style="background:none;"><i data-lucide="user-circle"></i></button>';
    else avatarDiv.innerHTML = '';
    document.getElementById("profileAvatarBtn")?.addEventListener("click", ()=> navigateTo("profile"));
    lucide.createIcons();
  }

  // RENDER HOME (all sections)
  function renderHomeScreen() {
    let html = `<div class="glass-card" style="padding:20px; margin-bottom:24px; background-size:cover;"> <h2 class="serif">Ακούστε το βιβλίο της εβδομάδας</h2><p>${booksDB[0].title} - ${booksDB[0].author}</p><div style="display:flex; gap:12px; margin-top:12px;"><button class="btn-primary" data-bookid="${booksDB[0].id}" data-action="playnow">Άκου τώρα</button><button class="btn-outline" data-bookid="${booksDB[0].id}" data-action="save">Αποθήκευση</button></div></div>`;
    // Continue listening
    const recentBooks = purchasedBooks.filter(id=> listeningProgress[id] && listeningProgress[id] > 10).slice(0,5);
    html += `<h3>🎧 Συνέχισε να ακούς</h3><div class="scroll-x">${recentBooks.map(id=> { let b= booksDB.find(x=>x.id===id); return b?`<div class="glass-card-light" style="padding:8px; width:140px;"><img src="${b.cover}" width="120" height="160" style="border-radius:12px;"><div><strong>${b.title}</strong></div><button class="resume-btn" data-id="${b.id}">Συνέχεια</button></div>`:'' }).join('') || `<div class="glass-card-light" style="padding:16px">Καμία πρόοδος</div>`}</div>`;
    // New & Trending
    html += `<h3>✨ New & Trending</h3><div class="scroll-x">${booksDB.slice(0,5).map(b=>bookCardMini(b)).join('')}</div>`;
    html += `<h3>🔥 Best Sellers</h3><div class="scroll-x">${booksDB.slice(1,6).map(b=>bookCardMini(b)).join('')}</div>`;
    html += `<h3>📚 Store Βιβλίων</h3><div class="scroll-x">${booksDB.filter(b=>!genreFilter || b.genre===genreFilter).map(b=>bookCardMini(b)).join('')}</div>`;
    html += `<h3>🏆 Top Charts</h3><div class="scroll-x">${booksDB.slice(2,7).map(b=>bookCardMini(b)).join('')}</div>`;
    html += `<div style="margin:20px 0"><h3>📖 Είδη</h3><div style="display:flex; flex-wrap:wrap; gap:10px;">${["Ρομαντικά","Μυστήριο & Θρίλερ","Μυθιστορήματα & Λογοτεχνία","Μη Μυθοπλασία","Παιδικά","Όλα τα είδη"].map(t=>`<button class="genre-filter glass-card-light" data-genre="${t}" style="padding:8px 16px;">${t}</button>`).join('')}</div></div>`;
    html += `<h3>🚀 Έρχονται σύντομα</h3><div class="scroll-x"><div class="glass-card-light" style="padding:12px;">"Μαύρη Θάλασσα" Μαρτίου 2025</div><div class="glass-card-light">"Έρωτας στη Σκιά" Απρίλιος</div></div>`;
    document.getElementById("screenContainer").innerHTML = html;
    attachBookEvents();
    document.querySelectorAll(".genre-filter").forEach(btn=> btn.addEventListener("click",(e)=>{ genreFilter = btn.dataset.genre === "Όλα τα είδη"? null : btn.dataset.genre; renderHomeScreen(); }));
    document.querySelectorAll(".resume-btn").forEach(btn=> btn.addEventListener("click",(e)=>{ let bid=btn.dataset.id; if(isOwned(bid)) { playBook(bid); navigateTo("player",bid); } else showToast("Πρώτα αγοράστε το βιβλίο"); }));
  }

  function bookCardMini(b){ return `<div class="glass-card-light" style="width:140px; padding:8px; cursor:pointer;" data-id="${b.id}"><img src="${b.cover}" style="width:120px; height:160px; border-radius:12px;"><div style="font-weight:bold;">${b.title}</div><div style="font-size:12px;">${b.author}</div><button class="quickview" data-id="${b.id}">Λεπτομέρειες</button></div>`; }
  function attachBookEvents() { document.querySelectorAll(".quickview").forEach(el=> el.addEventListener("click",(e)=>{ let id=el.dataset.id; navigateTo("product", id); })); document.querySelectorAll("[data-action='playnow']").forEach(btn=>btn.addEventListener("click",(e)=>{ let id=btn.dataset.bookid; if(isOwned(id)){ playBook(id); navigateTo("player",id);} else showToast("Αγοράστε πρώτα το βιβλίο"); })); document.querySelectorAll("[data-action='save']").forEach(btn=>btn.addEventListener("click",()=>showToast("Αποθηκεύτηκε στη βιβλιοθήκη σας"))); document.querySelectorAll("[data-id]").forEach(card=>{ if(!card.classList.contains("quickview")) card.addEventListener("click",()=> navigateTo("product", card.dataset.id)); }); lucide.createIcons(); }

  function renderLibraryScreen() { let owned = booksDB.filter(b=>purchasedBooks.includes(b.id)); let html = `<h2>Βιβλιοθήκη μου</h2>${owned.length===0? `<div class="glass-card" style="padding:40px; text-align:center;"><i data-lucide="book-open"></i><p>Δεν έχετε αγορασμένα βιβλία ακόμα</p></div>` : owned.map(b=>`<div class="glass-card-light" style="display:flex; gap:12px; margin-bottom:12px; padding:12px;" data-id="${b.id}"><img src="${b.cover}" width="60" height="80"><div><div><strong>${b.title}</strong></div><div>${b.author}</div><button class="play-lib" data-id="${b.id}">Αναπαραγωγή</button></div></div>`).join('')}`; document.getElementById("screenContainer").innerHTML = html; document.querySelectorAll(".play-lib").forEach(btn=> btn.addEventListener("click",(e)=>{ let id=btn.dataset.id; playBook(id); navigateTo("player",id); })); document.querySelectorAll("[data-id]").forEach(el=>el.addEventListener("click",()=> navigateTo("product",el.dataset.id))); lucide.createIcons(); }
  function renderSearchScreen() { let html = `<input type="text" id="searchInput" placeholder="Αναζήτηση τίτλου ή συγγραφέα..." class="glass-card-light" style="width:100%;"><div id="searchResults"></div>`; document.getElementById("screenContainer").innerHTML = html; document.getElementById("searchInput").addEventListener("input",(e)=>{ let val=e.target.value.toLowerCase(); let filtered=booksDB.filter(b=>b.title.toLowerCase().includes(val)||b.author.toLowerCase().includes(val)); document.getElementById("searchResults").innerHTML = filtered.map(b=>`<div class="glass-card-light" style="margin:10px 0; padding:12px; display:flex; gap:12px;" data-id="${b.id}"><img src="${b.cover}" width="50" height="65"><div><strong>${b.title}</strong><div>${b.author}</div></div></div>`).join(''); document.querySelectorAll("#searchResults [data-id]").forEach(el=>el.addEventListener("click",()=> navigateTo("product",el.dataset.id))); }); lucide.createIcons(); }
  function renderProductDetail(bookId) { let book = booksDB.find(b=>b.id===bookId); let owned = isOwned(bookId); let html = `<div class="glass-card" style="padding:20px"><img src="${book.cover}" width="100%" style="border-radius:24px;"><h1>${book.title}</h1><p>${book.author} | Αφήγηση: ${book.narrator}</p><div>⭐ ${book.rating} | ${book.genre}</div><p>${book.description}</p><div style="display:flex; gap:16px; margin:20px 0;"><button id="previewBtn" class="btn-outline">Δείγμα</button>${owned? `<button id="playBtn" class="btn-primary">Αναπαραγωγή</button>` : `<button id="buyBtn" class="btn-primary">€${book.price} - Αγορά</button>`}</div><h3>Κριτικές</h3><div>★★★★☆ "Υπέροχο!" - Μαρία</div><div>★★★★★ "Συναρπαστικό" - Γιώργος</div></div>`; document.getElementById("screenContainer").innerHTML = html; document.getElementById("previewBtn")?.addEventListener("click",()=>{ let previewAud = new Audio(book.previewUrl); previewAud.play(); setTimeout(()=>previewAud.pause(),10000); showToast("Δείγμα 10 δευτερολέπτων"); }); if(owned) document.getElementById("playBtn")?.addEventListener("click",()=>{ playBook(bookId); navigateTo("player",bookId); }); else document.getElementById("buyBtn")?.addEventListener("click",()=>{ selectedBookForPayment = book; navigateTo("payment", book.id); }); lucide.createIcons(); }
  function renderPaymentScreen(bookId) { let book = booksDB.find(b=>b.id===bookId); let html = `<div class="glass-card" style="padding:20px"><h2>Αγορά: ${book.title}</h2><p>Τιμή: €${book.price}</p><h3>Τρόπος Πληρωμής</h3><select id="paymentSelect"><option>Apple Pay (•••1234)</option><option>Πιστωτική Κάρτα (**** 4242)</option><option>PayPal</option></select><input id="cardName" placeholder="Όνομα κατόχου" class="glass-card-light" style="width:100%; margin-top:12px;"><input id="address" placeholder="Διεύθυνση χρέωσης" value="${currentUser.address}" class="glass-card-light" style="width:100%; margin-top:12px;"><button id="confirmPay" class="btn-primary" style="margin-top:20px;">Ολοκλήρωση Αγοράς</button></div>`; document.getElementById("screenContainer").innerHTML = html; document.getElementById("confirmPay").addEventListener("click",()=>{ if(!purchasedBooks.includes(book.id)) purchasedBooks.push(book.id); saveStorage(); showToast(`Αγοράσατε το "${book.title}"`); navigateTo("library"); }); lucide.createIcons(); }
  function renderPlayerScreen(bookId) { let book = booksDB.find(b=>b.id===bookId); if(!book || !isOwned(bookId)) { showToast("Δεν έχετε πρόσβαση"); navigateTo("home"); return; } let prog = listeningProgress[bookId] || 0; let dur = audio?.duration || 100; let per = (prog/dur)*100; let html = `<div><img src="${book.cover}" style="width:80%; border-radius:32px; margin-bottom:20px;"><h2>${book.title}</h2><div class="progress-bar" id="playerProgressParent"><div id="playerProgressFill" class="progress-fill" style="width:${per}%"></div></div><div style="display:flex; justify-content:space-between"><span id="currentTime">${formatTime(prog)}</span><span id="durationTime">${formatTime(dur)}</span></div><div style="display:flex; justify-content:center; gap:32px; margin:20px;"><button id="playPauseBtn" class="glass-card-light"><i data-lucide="${isPlayingGlobal ? 'pause' : 'play'}"></i></button><button id="prevBtn"><i data-lucide="skip-back"></i></button><button id="nextBtn"><i data-lucide="skip-forward"></i></button></div><div style="display:flex; gap:10px; justify-content:center">${[1,1.25,1.5,2].map(sp=>`<button class="speed-btn ${currentSpeed===sp?'btn-primary':'glass-card-light'}" data-speed="${sp}">${sp}x</button>`).join('')}</div><button id="moonBtn"><i data-lucide="moon"></i></button></div>`; document.getElementById("screenContainer").innerHTML = html; document.getElementById("playPauseBtn")?.addEventListener("click",()=>{ if(isPlayingGlobal) pauseCurrent(); else playBook(bookId); renderPlayerScreen(bookId); }); document.querySelectorAll(".speed-btn").forEach(btn=> btn.addEventListener("click",()=>{ setSpeed(parseFloat(btn.dataset.speed)); renderPlayerScreen(bookId); })); if(audio && activeBookPlaying===bookId) setInterval(()=>{ if(currentScreen==="player") updatePlayerProgressBar(); },500); lucide.createIcons(); }
  function renderProfileScreen() { let html = `<div class="glass-card" style="padding:20px"><div><i data-lucide="user-circle" size="48"></i><h2>${currentUser.name}</h2><p>${currentUser.email}</p><button id="editUserBtn" class="btn-outline">Επεξεργασία στοιχείων</button><button id="managePaymentsBtn" class="btn-outline">Πληρωμές/Πορτοφόλι</button><button id="couponsBtn" class="btn-outline">Κουπόνια</button><button id="helpBtn" class="btn-outline">Βοήθεια</button><button id="termsBtn" class="btn-outline">Όροι Χρήσης</button></div></div>`; document.getElementById("screenContainer").innerHTML = html; document.getElementById("editUserBtn").addEventListener("click",()=>navigateTo("userDetails")); document.getElementById("managePaymentsBtn").addEventListener("click",()=>navigateTo("paymentMethods")); document.getElementById("termsBtn").addEventListener("click",()=>navigateTo("terms")); lucide.createIcons(); }
  function renderUserDetails() { let html = `<div class="glass-card"><input id="uname" value="${currentUser.name}" placeholder="Όνομα"><input id="uphone" value="${currentUser.phone}"><input id="uemail" value="${currentUser.email}"><input id="uaddress" value="${currentUser.address}"><button id="saveUserBtn">Αποθήκευση</button></div>`; document.getElementById("screenContainer").innerHTML = html; document.getElementById("saveUserBtn").addEventListener("click",()=>{ currentUser={name:document.getElementById("uname").value,phone:document.getElementById("uphone").value,email:document.getElementById("uemail").value,address:document.getElementById("uaddress").value}; saveStorage(); showToast("Ενημέρωση επιτυχής"); navigateTo("profile"); }); lucide.createIcons(); }
  function renderPaymentMethodsScreen() { let html = `<div><h3>Μέθοδοι Πληρωμής</h3>${paymentMethods.map(p=>`<div class="glass-card-light">${p.type==="credit_card"?`💳 ${p.brand} ****${p.last4}`:`PayPal: ${p.email}`}</div>`).join('')}<button id="addCardBtn">Προσθήκη Κάρτας</button></div>`; document.getElementById("screenContainer").innerHTML = html; document.getElementById("addCardBtn")?.addEventListener("click",()=>{ paymentMethods.push({type:"credit_card",last4:"9876",brand:"Mastercard"}); saveStorage(); renderPaymentMethodsScreen(); showToast("Κάρτα προστέθηκε"); }); lucide.createIcons(); }
  function renderTermsScreen() { document.getElementById("screenContainer").innerHTML = `<div class="glass-card">Όροι Χρήσης: Όλο το περιεχόμενο προστατεύεται. Ηχητικά δείγματα demo.</div>`; lucide.createIcons(); }

  // Mini-player interactivity
  function initGlobalEvents() {
    loadStorage();
    if(audio) audio.pause();
    document.getElementById("miniPlayPause")?.addEventListener("click",()=>{ if(activeBookPlaying && isPlayingGlobal) pauseCurrent(); else if(activeBookPlaying) playBook(activeBookPlaying); });
    document.querySelectorAll(".nav-item").forEach(el=> el.addEventListener("click",(e)=> { let nav = el.dataset.nav; if(nav==="home") navigateTo("home"); else if(nav==="library") navigateTo("library"); else if(nav==="search") navigateTo("search"); }));
    navigateTo("home");
    setInterval(()=>{ if(activeBookPlaying && audio && !audio.paused) { updateMiniPlayButton(false); updatePlayerProgressBar(); } }, 1000);
  }
  window.onload = () => { initGlobalEvents(); };
</script>
</body>
</html>
