<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0c12">
  <title>audioNest — Premium Audiobooks</title>
  <!-- Google Fonts + Lucide -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* ----- DESIGN SYSTEM (glassmorphism + premium) ----- */
    :root {
      --bg-gradient-start: #0a0c12;
      --bg-gradient-end: #10131e;
      --glass-bg: rgba(20, 24, 36, 0.55);
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary: #c084fc;
      --primary-glow: rgba(192, 132, 252, 0.4);
      --text-main: #f0f0f0;
      --text-dim: #b0b3c0;
      --card-radius: 28px;
      --transition-smooth: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    body {
      background: radial-gradient(circle at 20% 30%, #141824, #0b0d14);
      font-family: 'DM Sans', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      background: radial-gradient(circle at 20% 30%, #141824, #0b0d14);
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    /* glassmorphism core */
    .glass-card, .glass-card-light {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      border-radius: var(--card-radius);
      border: 1px solid var(--glass-border);
      transition: var(--transition-smooth);
    }
    .glass-card-light {
      background: rgba(30, 34, 48, 0.6);
      backdrop-filter: blur(10px);
    }

    /* typography */
    h1, h2, h3, .serif {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    h2 { font-size: 1.65rem; margin: 0.75rem 0 0.5rem; }
    h3 { font-size: 1.25rem; margin: 1.2rem 0 0.7rem; display: flex; align-items: center; gap: 8px; }

    /* buttons */
    .btn-primary, .btn-outline {
      border-radius: 60px;
      padding: 10px 18px;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.2s;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: var(--primary); color: #0a0c12; box-shadow: 0 2px 8px var(--primary-glow); }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; }
    .btn-primary:active, .btn-outline:active { transform: scale(0.97); }

    /* scroll horizontal (momentum) */
    .scroll-x {
      display: flex;
      overflow-x: auto;
      gap: 16px;
      scrollbar-width: thin;
      padding-bottom: 12px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }
    .scroll-x > * { scroll-snap-align: start; flex-shrink: 0; }

    /* bottom nav + mini player */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(12, 15, 22, 0.88);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-around;
      padding: 10px 20px calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      color: #9ca3af;
      transition: color 0.2s;
      cursor: pointer;
    }
    .nav-item.active { color: var(--primary); }

    .mini-player {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 448px;
      background: rgba(18, 22, 32, 0.95);
      backdrop-filter: blur(24px);
      border-radius: 60px;
      padding: 8px 16px;
      z-index: 101;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      transition: var(--transition-smooth);
    }

    .main-content {
      padding: 20px 20px 110px 20px;
      min-height: 85vh;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1b2e;
      backdrop-filter: blur(16px);
      padding: 10px 20px;
      border-radius: 40px;
      z-index: 200;
      font-weight: 500;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* progress seek */
    .progress-bar {
      height: 6px;
      background: #2a2e3f;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill { background: var(--primary); width: 0%; height: 100%; border-radius: 10px; pointer-events: none; }
    .buffered-bar { background: rgba(255,255,255,0.2); height: 100%; border-radius: 10px; position: absolute; top: 0; left: 0; pointer-events: none; }

    /* transitions */
    .fade-enter { opacity: 0; transform: translateY(8px); }
    .fade-active { transition: opacity 0.2s, transform 0.2s; }

    /* book cards premium */
    .book-card { width: 140px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .book-card:active { transform: scale(0.98); }
    .book-cover-img { width: 120px; height: 160px; object-fit: cover; border-radius: 20px; box-shadow: 0 15px 25px -10px rgba(0,0,0,0.5); }

    /* safe area */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .bottom-nav { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .main-content { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
<div class="app-container" id="appRoot">
  <div id="dynamicHeader" style="padding: 20px 20px 8px; display: flex; justify-content: space-between; align-items: center;">
    <div id="backBtnWrapper"></div>
    <div class="serif" style="font-size: 22px; letter-spacing: -0.3px;">audioNest</div>
    <div id="avatarWrapper"></div>
  </div>
  <div id="screenContainer" class="main-content"></div>
  <div id="miniPlayer" class="mini-player" style="display: none;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img id="miniCover" width="44" height="44" style="border-radius: 14px; object-fit: cover;">
      <div style="flex:1"><div id="miniTitle" style="font-weight:600; font-size:14px;"></div><div id="miniAuthor" style="font-size:12px; color:#bbb"></div></div>
      <button id="miniPlayPauseBtn" class="glass-card-light" style="border:none; padding:8px; border-radius:40px;"><i data-lucide="play"></i></button>
    </div>
  </div>
  <div class="bottom-nav">
    <div class="nav-item" data-nav="home"><i data-lucide="house"></i><span>Αρχική</span></div>
    <div class="nav-item" data-nav="library"><i data-lucide="library"></i><span>Βιβλιοθήκη</span></div>
    <div class="nav-item" data-nav="search"><i data-lucide="search"></i><span>Αναζήτηση</span></div>
  </div>
</div>
<script>
  // ========================== PRODUCTION-LEVEL AUDIONEST APP ==========================
  (function(){
    // ------------------------------- CONSTANTS & DATA ---------------------------------
    const BOOKS_DB = [
      { id: "b1", title: "Ματωμένο Φεγγάρι", author: "Ελένη Βάρναλη", narrator: "Μιχάλης Σαράντης", genre: "Μυστήριο & Θρίλερ", releaseDate: "2024", rating: 4.8, price: 12.99, cover: "https://picsum.photos/id/104/300/450", description: "Ένα θρίλερ που κόβει την ανάσα... μυστικά σε ένα νησί.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { id: "b2", title: "Αιώνια Ρομαντζά", author: "Ναταλία Καρτερού", narrator: "Δήμητρα Μήτση", genre: "Ρομαντικά", releaseDate: "2024", rating: 4.6, price: 9.99, cover: "https://picsum.photos/id/26/300/450", description: "Μια ιστορία αγάπης που ταξιδεύει στον χρόνο.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { id: "b3", title: "Το Λάθος Αστέρι", author: "Φοίβος Γιαννόπουλος", narrator: "Αλέξης Γεωργίου", genre: "Μυθιστορήματα & Λογοτεχνία", releaseDate: "2023", rating: 4.9, price: 14.99, cover: "https://picsum.photos/id/20/300/450", description: "Δύο άγνωστοι συναντιούνται στο Παρίσι.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { id: "b4", title: "Τέχνη της Επιτυχίας", author: "Λίνα Μαυρίδη", narrator: "Αντρέας Κωνσταντίνου", genre: "Μη Μυθοπλασία", releaseDate: "2025", rating: 4.5, price: 17.99, cover: "https://picsum.photos/id/0/300/450", description: "Εργαλεία ανάπτυξης για κάθε επαγγελματία.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
      { id: "b5", title: "Ο Κήπος με τα Μυστικά", author: "Σοφία Κερασίδου", narrator: "Ειρήνη Παπαδάκη", genre: "Παιδικά", releaseDate: "2024", rating: 4.7, price: 6.99, cover: "https://picsum.photos/id/128/300/450", description: "Ένα παραμύθι για μικρούς και μεγάλους.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { id: "b6", title: "Σκοτεινά Ρεύματα", author: "Νίκος Αλεξίου", narrator: "Πέτρος Λαγός", genre: "Μυστήριο & Θρίλερ", releaseDate: "2025", rating: 4.8, price: 13.99, cover: "https://picsum.photos/id/175/300/450", description: "Υπόθεση εξαφάνισης στην Αθήνα.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { id: "b7", title: "Το Αστέρι της Αυγής", author: "Μαρία Παπαδάκη", narrator: "Λυδία Φωτιάδου", genre: "Ρομαντικά", releaseDate: "2024", rating: 4.3, price: 10.99, cover: "https://picsum.photos/id/169/300/450", description: "Ταξίδι στη Σαντορίνη.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
      { id: "b8", title: "Καθρέφτες Ψυχής", author: "Δημήτρης Παπαδόπουλος", narrator: "Άννα Μονογιού", genre: "Μυθιστορήματα & Λογοτεχνία", releaseDate: "2023", rating: 4.9, price: 11.99, cover: "https://picsum.photos/id/42/300/450", description: "Μια οικογενειακή σάγκα.", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
    ];

    // ---------- STORAGE SCHEMA ----------
    let AppStore = {
      purchased: [],        // book ids
      progress: {},         // { bookId: seconds }
      user: { name: "Αθηνά Μέρτζου", phone: "6901234567", email: "athena@audiobook.gr", address: "Λεωφόρος Συγγρού 15, Αθήνα" },
      paymentMethods: [{ type: "credit_card", last4: "4242", brand: "Visa" }],
      favorites: [],        // book ids
      recentSearches: [],
      lastScreen: "home",
      genreFilter: null
    };

    // helpers
    function sanitize(str) { return String(str).replace(/[<>]/g, ''); }
    function formatTime(sec) { if(isNaN(sec)) return "0:00"; let m = Math.floor(sec/60); let s = Math.floor(sec%60); return `${m}:${s<10?'0'+s:s}`; }
    function showToast(msg, duration=2000){ let t = document.createElement('div'); t.className='toast glass-card'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), duration); }
    
    // StorageManager
    const StorageMgr = {
      load(){ try { let d=localStorage.getItem('audioNest_v2'); if(d){ let parsed=JSON.parse(d); AppStore = { ...AppStore, ...parsed }; } } catch(e){} },
      save(){ try { localStorage.setItem('audioNest_v2', JSON.stringify({ purchased:AppStore.purchased, progress:AppStore.progress, user:AppStore.user, paymentMethods:AppStore.paymentMethods, favorites:AppStore.favorites, recentSearches:AppStore.recentSearches, lastScreen:AppStore.lastScreen })); } catch(e){} },
      throttleSave: null,
      persist(){ if(this.throttleSave) clearTimeout(this.throttleSave); this.throttleSave = setTimeout(()=> this.save(), 200); }
    };

    // ---------------- AUDIO MANAGER (singleton, production-ready) ----------------
    class AudioCore {
      constructor() {
        this.audio = null;
        this.activeBookId = null;
        this.isPlaying = false;
        this.speed = 1;
        this.volume = 0.8;
        this.muted = false;
        this.progressRAF = null;
        this.listeners = {};
      }
      initAudio(src, bookId) {
        if(this.audio && this.activeBookId !== bookId) { this.audio.pause(); this.audio = null; }
        if(!this.audio) {
          this.audio = new Audio(src);
          this.audio.preload = 'metadata';
          this.audio.volume = this.muted ? 0 : this.volume;
          this.audio.playbackRate = this.speed;
          this.attachEvents();
        }
        this.activeBookId = bookId;
        if(AppStore.progress[bookId]) this.audio.currentTime = AppStore.progress[bookId];
      }
      attachEvents() {
        if(!this.audio) return;
        this.audio.addEventListener('timeupdate', () => this.handleTimeUpdate());
        this.audio.addEventListener('ended', () => this.handleEnded());
        this.audio.addEventListener('loadedmetadata', () => this.emit('metadata'));
        this.audio.addEventListener('canplay', () => this.emit('ready'));
        this.audio.addEventListener('waiting', () => this.emit('buffering', true));
        this.audio.addEventListener('playing', () => this.emit('buffering', false));
      }
      handleTimeUpdate() { if(this.audio && this.activeBookId) { AppStore.progress[this.activeBookId] = this.audio.currentTime; StorageMgr.persist(); this.emit('progress', this.audio.currentTime, this.audio.duration, this.audio.buffered); } }
      handleEnded() { this.isPlaying=false; this.emit('ended'); this.updateUI(); }
      play() { if(this.audio && this.activeBookId) { this.audio.play().catch(e=>showToast("Σφάλμα αναπαραγωγής")); this.isPlaying=true; this.emit('playstate',true); this.startProgressUpdates(); this.updateUI(); } }
      pause() { if(this.audio) { this.audio.pause(); this.isPlaying=false; this.emit('playstate',false); this.updateUI(); } }
      seek(percent) { if(this.audio && this.activeBookId) { let time = percent * this.audio.duration; this.audio.currentTime = Math.min(Math.max(time,0), this.audio.duration); } }
      setSpeed(sp) { this.speed = sp; if(this.audio) this.audio.playbackRate = sp; this.emit('speedchange', sp); }
      setVolume(vol) { this.volume = Math.min(1,Math.max(0,vol)); if(this.audio && !this.muted) this.audio.volume = this.volume; this.emit('volume', this.volume); }
      toggleMute() { this.muted = !this.muted; if(this.audio) this.audio.volume = this.muted ? 0 : this.volume; this.emit('mute', this.muted); }
      skip(seconds) { if(this.audio) this.audio.currentTime = Math.min(this.audio.duration, Math.max(0, this.audio.currentTime + seconds)); }
      startProgressUpdates() { if(this.progressRAF) cancelAnimationFrame(this.progressRAF); const update = () => { if(this.isPlaying && this.audio) this.emit('tick', this.audio.currentTime, this.audio.duration); this.progressRAF = requestAnimationFrame(update); }; this.progressRAF = requestAnimationFrame(update); }
      stopProgress() { if(this.progressRAF) cancelAnimationFrame(this.progressRAF); this.progressRAF=null; }
      on(event, cb) { if(!this.listeners[event]) this.listeners[event]=[]; this.listeners[event].push(cb); }
      emit(event, ...args) { if(this.listeners[event]) this.listeners[event].forEach(cb=>cb(...args)); }
      updateUI() { EventBus.emit('playerStateChanged', { playing: this.isPlaying, bookId: this.activeBookId }); }
    }
    const AudioPlayer = new AudioCore();

    // EventBus central
    const EventBus = { events:{}, on(e,fn){ if(!this.events[e]) this.events[e]=[]; this.events[e].push(fn); }, emit(e,data){ if(this.events[e]) this.events[e].forEach(fn=>fn(data)); } };

    // Navigation manager + renderer
    let currentScreen = "home";
    let currentProductId = null;
    let animationFrame = null;
    function navigateTo(screen, param=null) {
      currentScreen = screen;
      AppStore.lastScreen = screen;
      StorageMgr.persist();
      if(screen === 'product') currentProductId = param;
      renderCurrentScreen();
      updateHeaderButtons();
      updateNavActive();
    }
    function updateHeaderButtons() {
      const backDiv = document.getElementById('backBtnWrapper');
      const avatarDiv = document.getElementById('avatarWrapper');
      if(currentScreen !== 'home' && currentScreen !== 'library' && currentScreen !== 'search' && currentScreen !== 'profile') {
        backDiv.innerHTML = '<button id="globalBackBtn" style="background:none; border:none;"><i data-lucide="arrow-left"></i></button>';
        document.getElementById('globalBackBtn')?.addEventListener('click', ()=> navigateTo('home'));
      } else backDiv.innerHTML = '';
      avatarDiv.innerHTML = (currentScreen === 'home') ? '<button id="profileAvatar" style="background:none;"><i data-lucide="user-circle"></i></button>' : '';
      document.getElementById('profileAvatar')?.addEventListener('click',()=> navigateTo('profile'));
      lucide.createIcons();
    }
    function updateNavActive() {
      document.querySelectorAll('.nav-item').forEach(el=> { el.classList.toggle('active', el.dataset.nav === currentScreen); });
    }

    // --- RENDER FUNCTIONS (modular, event delegation) ---
    function renderCurrentScreen() {
      let html = '';
      if(currentScreen === 'home') html = renderHome();
      else if(currentScreen === 'library') html = renderLibrary();
      else if(currentScreen === 'search') html = renderSearchUI();
      else if(currentScreen === 'product') html = renderProductDetail(currentProductId);
      else if(currentScreen === 'payment') html = renderPaymentScreen(currentProductId);
      else if(currentScreen === 'player') html = renderPlayerScreen();
      else if(currentScreen === 'profile') html = renderProfile();
      else if(currentScreen === 'userDetails') html = renderUserDetails();
      else if(currentScreen === 'paymentMethods') html = renderPaymentMethods();
      else if(currentScreen === 'terms') html = `<div class="glass-card" style="padding:24px"><h3>Όροι Χρήσης</h3><p>Προστασία περιεχομένου, demo ήχοι, χρήση για ακρόαση.</p></div>`;
      const container = document.getElementById('screenContainer');
      container.style.opacity = '0';
      setTimeout(()=> { container.innerHTML = html; lucide.createIcons(); container.style.transition='opacity 0.2s'; container.style.opacity='1'; attachDelegatedEvents(); }, 20);
    }

    // Helper: render book card
    function bookCardMini(b, showQuick=true) { return `<div class="glass-card-light book-card" data-book-id="${b.id}"><img class="book-cover-img" src="${b.cover}" loading="lazy"><div style="font-weight:600; margin-top:8px;">${b.title}</div><div style="font-size:12px;">${b.author}</div>${showQuick? `<button class="quickview-btn" data-id="${b.id}" style="margin-top:6px;">Λεπτομέρειες</button>`:''}</div>`; }
    function renderHome() {
      let ownedIds = AppStore.purchased;
      let continueBooks = ownedIds.filter(id=> AppStore.progress[id] && AppStore.progress[id] > 5).slice(0,5);
      let trending = BOOKS_DB.slice(0,5);
      let best = BOOKS_DB.slice(1,6);
      let storeBooks = AppStore.genreFilter ? BOOKS_DB.filter(b=>b.genre === AppStore.genreFilter) : BOOKS_DB;
      let genres = ["Ρομαντικά","Μυστήριο & Θρίλερ","Μυθιστορήματα & Λογοτεχνία","Μη Μυθοπλασία","Παιδικά","Όλα τα είδη"];
      return `
        <div class="glass-card" style="padding:20px; margin-bottom:24px;"><h2>✨ Δώρο ακρόασης</h2><p>${BOOKS_DB[0].title} — ${BOOKS_DB[0].author}</p><div style="display:flex; gap:12px; margin-top:12px;"><button class="btn-primary" data-book-action="playnow" data-id="${BOOKS_DB[0].id}">Άκου τώρα</button><button class="btn-outline" data-book-action="save">Αποθήκευση</button></div></div>
        <h3>🎧 Συνέχισε να ακούς</h3><div class="scroll-x">${continueBooks.length? continueBooks.map(id=>bookCardMini(BOOKS_DB.find(b=>b.id===id),true)).join('') : '<div class="glass-card-light" style="padding:16px;">Καμία πρόοδος</div>'}</div>
        <h3>✨ New & Trending</h3><div class="scroll-x">${trending.map(b=>bookCardMini(b)).join('')}</div>
        <h3>🔥 Best Sellers</h3><div class="scroll-x">${best.map(b=>bookCardMini(b)).join('')}</div>
        <h3>📚 Store Βιβλίων</h3><div class="scroll-x">${storeBooks.map(b=>bookCardMini(b)).join('')}</div>
        <div style="margin:20px 0"><h3>📖 Είδη</h3><div style="display:flex; flex-wrap:wrap; gap:10px;">${genres.map(g=>`<button class="glass-card-light genre-filter-btn" data-genre="${g}" style="padding:8px 18px;">${g}</button>`).join('')}</div></div>
        <h3>🚀 Έρχονται σύντομα</h3><div class="scroll-x"><div class="glass-card-light" style="padding:12px;">"Μαύρη Θάλασσα" Μαρτίου 2025</div></div>
      `;
    }
    function renderLibrary() { let owned = BOOKS_DB.filter(b=>AppStore.purchased.includes(b.id)); if(!owned.length) return `<div class="glass-card" style="padding:40px; text-align:center;"><i data-lucide="book-open"></i><p>Δεν έχετε βιβλία ακόμα</p></div>`; return owned.map(b=>`<div class="glass-card-light" style="display:flex; gap:14px; margin-bottom:14px; padding:12px;" data-book-id="${b.id}"><img src="${b.cover}" width="60" height="80" style="border-radius:14px;"><div><strong>${b.title}</strong><div>${b.author}</div><button class="play-lib-btn" data-id="${b.id}" style="margin-top:6px;">Αναπαραγωγή</button></div></div>`).join(''); }
    function renderSearchUI() { return `<input type="text" id="searchField" placeholder="Αναζήτηση τίτλου ή συγγραφέα..." class="glass-card-light" style="width:100%; padding:14px;"><div id="searchResultsContainer" style="margin-top:20px;"></div><div id="recentSearches" class="scroll-x" style="margin-top:10px;"></div>`; }
    function renderProductDetail(id) { let b = BOOKS_DB.find(x=>x.id===id); let owned = AppStore.purchased.includes(id); return `<div class="glass-card" style="padding:24px"><img src="${b.cover}" style="width:100%; border-radius:28px;"><h1>${b.title}</h1><p>${b.author} | ${b.narrator}</p><div>⭐ ${b.rating} | ${b.genre}</div><p>${b.description}</p><div style="display:flex; gap:16px; margin:20px 0;"><button id="previewSample" class="btn-outline">Δείγμα</button>${owned? `<button id="playNowBtn" class="btn-primary">Αναπαραγωγή</button>` : `<button id="buyNowBtn" class="btn-primary">€${b.price} - Αγορά</button>`}</div><h3>Κριτικές</h3><div>★★★★★ "Αριστούργημα" - Κώστας</div></div>`; }
    function renderPaymentScreen(bookId) { let book = BOOKS_DB.find(b=>b.id===bookId); return `<div class="glass-card" style="padding:24px"><h2>Αγορά: ${book.title}</h2><p>Τιμή: €${book.price}</p><select id="paymentSelect" class="glass-card-light"><option>Apple Pay</option><option>Πιστωτική Κάρτα</option><option>PayPal</option></select><input id="cardName" placeholder="Όνομα κατόχου" class="glass-card-light" style="width:100%; margin-top:12px;"><input id="billingAddr" placeholder="Διεύθυνση" value="${AppStore.user.address}" class="glass-card-light" style="width:100%; margin-top:12px;"><button id="confirmPurchaseBtn" class="btn-primary" style="margin-top:20px;">Ολοκλήρωση</button></div>`; }
    function renderPlayerScreen() { if(!AudioPlayer.activeBookId) return '<div class="glass-card">Δεν υπάρχει ενεργό βιβλίο</div>'; let book = BOOKS_DB.find(b=>b.id===AudioPlayer.activeBookId); if(!book) return ''; let prog = AppStore.progress[book.id] || 0; let dur = AudioPlayer.audio?.duration || 1; let perc = (prog/dur)*100; return `<div style="text-align:center"><img src="${book.cover}" style="width:80%; border-radius:32px; margin-bottom:20px;"><h2>${book.title}</h2><div class="progress-bar" id="playerProgressBarParent" style="margin: 16px 0;"><div class="buffered-bar" id="bufferedFill" style="width:0%"></div><div id="playerProgressFill" class="progress-fill" style="width:${perc}%"></div></div><div style="display:flex; justify-content:space-between"><span id="currTimeLabel">${formatTime(prog)}</span><span id="durLabel">${formatTime(dur)}</span></div><div style="display:flex; justify-content:center; gap:28px; margin:20px;"><button id="skipBack15" class="glass-card-light"><i data-lucide="skip-back"></i> 15</button><button id="playerPlayPauseBtn" class="btn-primary"><i data-lucide="${AudioPlayer.isPlaying ? 'pause' : 'play'}"></i></button><button id="skipForward15" class="glass-card-light">15 <i data-lucide="skip-forward"></i></button></div><div style="display:flex; gap:12px; justify-content:center; margin:12px 0;">${[1,1.25,1.5,2].map(sp=>`<button class="speed-btn ${AudioPlayer.speed===sp?'btn-primary':'glass-card-light'}" data-speed="${sp}">${sp}x</button>`).join('')}</div><div><input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="${AudioPlayer.volume}" style="width:100px;"> <button id="muteToggle"><i data-lucide="volume-2"></i></button></div></div>`; }
    function renderProfile() { return `<div class="glass-card" style="padding:24px"><i data-lucide="user-circle" size="48"></i><h2>${AppStore.user.name}</h2><p>${AppStore.user.email}</p><button id="editProfileBtn" class="btn-outline" style="margin:8px">Στοιχεία Χρήστη</button><button id="managePayBtn" class="btn-outline">Πληρωμές</button><button id="showTermsBtn" class="btn-outline">Όροι</button></div>`; }
    function renderUserDetails() { return `<div class="glass-card" style="padding:20px"><input id="uname" value="${AppStore.user.name}" class="glass-card-light"><input id="uphone" value="${AppStore.user.phone}"><input id="uemail" value="${AppStore.user.email}"><input id="uaddress" value="${AppStore.user.address}"><button id="saveUserBtn" class="btn-primary">Αποθήκευση</button></div>`; }
    function renderPaymentMethods() { return `<div><h3>Μέθοδοι</h3>${AppStore.paymentMethods.map(p=>`<div class="glass-card-light">${p.type === 'credit_card'? `💳 ${p.brand} ${p.last4}`:`PayPal`}</div>`).join('')}<button id="addCardBtn" class="btn-outline">+ Κάρτα</button></div>`; }

    // Event Delegation (main)
    function attachDelegatedEvents() {
      const container = document.getElementById('screenContainer');
      if(!container) return;
      container.querySelectorAll('[data-book-id]').forEach(el=> el.addEventListener('click', (e)=> { if(!e.target.closest('.quickview-btn, .play-lib-btn')) navigateTo('product', el.dataset.bookId); }));
      container.querySelectorAll('.quickview-btn').forEach(btn=> btn.addEventListener('click',(e)=>{ e.stopPropagation(); navigateTo('product', btn.dataset.id); }));
      container.querySelectorAll('.play-lib-btn, [data-book-action="playnow"]').forEach(btn=> btn.addEventListener('click',(e)=>{ let id = btn.dataset.id; if(AppStore.purchased.includes(id)) { loadAndPlay(id); navigateTo('player'); } else showToast("Αγοράστε πρώτα το βιβλίο"); }));
      container.querySelectorAll('.genre-filter-btn').forEach(btn=> btn.addEventListener('click',()=>{ AppStore.genreFilter = btn.dataset.genre === "Όλα τα είδη" ? null : btn.dataset.genre; renderCurrentScreen(); }));
      // product detail buttons
      const preview = document.getElementById('previewSample');
      if(preview) preview.addEventListener('click',()=>{ let book = BOOKS_DB.find(b=>b.id===currentProductId); if(book){ let testAudio = new Audio(book.previewUrl); testAudio.play(); setTimeout(()=>testAudio.pause(),8000); showToast("Δείγμα 8 δευτερολέπτων"); } });
      const buyBtn = document.getElementById('buyNowBtn');
      if(buyBtn) buyBtn.addEventListener('click',()=>{ navigateTo('payment', currentProductId); });
      const playNow = document.getElementById('playNowBtn');
      if(playNow) playNow.addEventListener('click',()=>{ loadAndPlay(currentProductId); navigateTo('player'); });
      const confirmPurchase = document.getElementById('confirmPurchaseBtn');
      if(confirmPurchase) confirmPurchase.addEventListener('click',()=>{ if(!AppStore.purchased.includes(currentProductId)) AppStore.purchased.push(currentProductId); StorageMgr.persist(); showToast("Αγορά επιτυχής!"); navigateTo('library'); });
      // Player events
      const ppBtn = document.getElementById('playerPlayPauseBtn'); if(ppBtn) ppBtn.addEventListener('click',()=>{ AudioPlayer.isPlaying ? AudioPlayer.pause() : AudioPlayer.play(); renderPlayerScreen(); });
      const speedBtns = document.querySelectorAll('.speed-btn'); speedBtns.forEach(btn=> btn.addEventListener('click',()=>{ AudioPlayer.setSpeed(parseFloat(btn.dataset.speed)); renderPlayerScreen(); }));
      const skipBack = document.getElementById('skipBack15'); if(skipBack) skipBack.addEventListener('click',()=>{ AudioPlayer.skip(-15); });
      const skipFwd = document.getElementById('skipForward15'); if(skipFwd) skipFwd.addEventListener('click',()=>{ AudioPlayer.skip(15); });
      const volSlider = document.getElementById('volumeSlider'); if(volSlider) volSlider.addEventListener('input',(e)=> AudioPlayer.setVolume(parseFloat(e.target.value)));
      const muteBtn = document.getElementById('muteToggle'); if(muteBtn) muteBtn.addEventListener('click',()=> AudioPlayer.toggleMute());
      const progressParent = document.getElementById('playerProgressBarParent'); if(progressParent) progressParent.addEventListener('click',(e)=>{ let rect = progressParent.getBoundingClientRect(); let percent = (e.clientX - rect.left)/rect.width; AudioPlayer.seek(Math.min(1,Math.max(0,percent))); });
      // profile
      const editProfile = document.getElementById('editProfileBtn'); if(editProfile) editProfile.addEventListener('click',()=>navigateTo('userDetails'));
      const managePay = document.getElementById('managePayBtn'); if(managePay) managePay.addEventListener('click',()=>navigateTo('paymentMethods'));
      const termsBtn = document.getElementById('showTermsBtn'); if(termsBtn) termsBtn.addEventListener('click',()=>navigateTo('terms'));
      const saveUser = document.getElementById('saveUserBtn'); if(saveUser) saveUser.addEventListener('click',()=>{ AppStore.user.name=document.getElementById('uname').value; AppStore.user.phone=document.getElementById('uphone').value; AppStore.user.email=document.getElementById('uemail').value; AppStore.user.address=document.getElementById('uaddress').value; StorageMgr.persist(); showToast("Ενημερώθηκε"); navigateTo('profile'); });
      const addCard = document.getElementById('addCardBtn'); if(addCard) addCard.addEventListener('click',()=>{ AppStore.paymentMethods.push({type:"credit_card",last4:"9876",brand:"Mastercard"}); StorageMgr.persist(); renderPaymentMethods(); });
      // search dynamic
      const searchField = document.getElementById('searchField'); if(searchField) searchField.addEventListener('input', (e) => { let val = e.target.value.toLowerCase(); let filtered = BOOKS_DB.filter(b=>b.title.toLowerCase().includes(val)||b.author.toLowerCase().includes(val)); document.getElementById('searchResultsContainer').innerHTML = filtered.length? filtered.map(b=>`<div class="glass-card-light" style="margin:8px 0; padding:12px; display:flex; gap:12px;" data-book-id="${b.id}"><img src="${b.cover}" width="50" height="65"><div><strong>${b.title}</strong><div>${b.author}</div></div></div>`).join('') : '<div class="glass-card">Δεν βρέθηκαν αποτελέσματα</div>'; attachDelegatedEvents(); });
    }
    function loadAndPlay(bookId) { let book = BOOKS_DB.find(b=>b.id===bookId); if(!book || !AppStore.purchased.includes(bookId)) return; AudioPlayer.initAudio(book.previewUrl, bookId); AudioPlayer.play(); updateMiniPlayer(book); }
    function updateMiniPlayer(book) { let mp = document.getElementById('miniPlayer'); if(book && AppStore.purchased.includes(book.id)) { mp.style.display = 'flex'; document.getElementById('miniCover').src = book.cover; document.getElementById('miniTitle').innerText = book.title; document.getElementById('miniAuthor').innerText = book.author; } else mp.style.display = 'none'; lucide.createIcons(); }
    EventBus.on('playerStateChanged', (state)=>{ if(state.bookId) { let b = BOOKS_DB.find(x=>x.id===state.bookId); if(b) updateMiniPlayer(b); } let miniBtn = document.getElementById('miniPlayPauseBtn'); if(miniBtn) miniBtn.innerHTML = `<i data-lucide="${state.playing ? 'pause' : 'play'}"></i>`; lucide.createIcons(); });
    document.getElementById('miniPlayPauseBtn')?.addEventListener('click',()=>{ AudioPlayer.isPlaying ? AudioPlayer.pause() : AudioPlayer.play(); });
    // Navigation listeners
    document.querySelectorAll('.nav-item').forEach(el=> el.addEventListener('click',()=> navigateTo(el.dataset.nav)));
    StorageMgr.load(); AudioPlayer.on('playstate',()=> EventBus.emit('playerStateChanged',{playing:AudioPlayer.isPlaying, bookId:AudioPlayer.activeBookId}));
    navigateTo(AppStore.lastScreen || 'home');
  })();
</script>
</body>
</html>
